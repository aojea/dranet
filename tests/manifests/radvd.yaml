# Router Advertisement daemon on the node side of the slaac-cli/slaac-rtr
# veth pair: the router a fabric would have on the link.
apiVersion: v1
kind: Pod
metadata:
  name: radvd
  labels:
    app: radvd
spec:
  hostNetwork: true
  nodeSelector:
    kubernetes.io/hostname: dranet-test-cluster-worker
  containers:
  - name: radvd
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    command:
    - sh
    - -c
    - |
      set -e
      apk add --no-cache radvd
      cat > /etc/radvd.conf <<'EOF'
      interface slaac-rtr {
        AdvSendAdvert on;
        MinRtrAdvInterval 3;
        MaxRtrAdvInterval 10;
        prefix 2001:db8:5aac::/64 {
          AdvOnLink on;
          AdvAutonomous on;
        };
        route 2001:db8:5aac:1::/64 {
        };
      };
      EOF
      exec radvd --nodaemon --logmethod stderr --debug 2 --config /etc/radvd.conf --pidfile /tmp/radvd.pid
    securityContext:
      capabilities:
        add: ["NET_ADMIN", "NET_RAW"]
